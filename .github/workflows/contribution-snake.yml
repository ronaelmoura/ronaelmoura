name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ronaelmoura
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#19D3FF&color_dots=#071426,#0B2A4A,#1479FF,#19D3FF,#EAFBFF
      - name: Publish generated asset
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
