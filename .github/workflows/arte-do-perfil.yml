name: arte do perfil

# Regenera o banner e o Perola Negra de hora em hora:
# - a cena acompanha a hora do dia em Sao Paulo
# - as ondas acompanham o grafico de contribuicoes
# - o monitor mostra o ultimo commit e o status do CI

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/arte-do-perfil.yml'

permissions:
  contents: write

concurrency:
  group: arte-do-perfil
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gerar SVGs
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar se mudou
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for tentativa in 1 2 3; do
            git add assets
            if git diff --quiet --cached; then
              echo "nada mudou"
              exit 0
            fi

            git commit -m "chore: atualizar arte do perfil"
            if git push; then
              exit 0
            fi

            # Alguem publicou enquanto este job rodava. Os SVGs sao derivados de
            # scripts/, entao a saida certa e voltar para a nova base e gerar de
            # novo — nunca mesclar arte gerada, que so produz conflito bobo.
            echo "remoto mudou; refazendo sobre a nova base (tentativa $tentativa)"
            git fetch origin main
            git reset --hard origin/main
            node scripts/generate.mjs
          done

          echo "nao foi possivel publicar depois de 3 tentativas"
          exit 1
