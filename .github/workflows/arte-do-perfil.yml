name: arte do perfil

# Regenera o banner e o Perola Negra de hora em hora:
# - a cena acompanha a hora do dia em Sao Paulo
# - as ondas acompanham o grafico de contribuicoes
# - o monitor mostra o ultimo commit e o status do CI

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/arte-do-perfil.yml'

permissions:
  contents: write

concurrency:
  group: arte-do-perfil
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gerar SVGs
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar se mudou
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if git diff --quiet --cached; then
            echo "nada mudou"
          else
            git commit -m "chore: atualizar arte do perfil"
            git push
          fi
