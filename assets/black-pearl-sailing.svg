<svg width="100%" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pérola Negra navegando em mar agitado sob a lua">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020409" />
      <stop offset="55%" stop-color="#05070D" />
      <stop offset="100%" stop-color="#0A1424" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1626" />
      <stop offset="45%" stop-color="#071019" />
      <stop offset="100%" stop-color="#03060B" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCEBFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#19D3FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#19D3FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="moonPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19D3FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#19D3FF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sailShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C2B" />
      <stop offset="100%" stop-color="#060A12" />
    </linearGradient>
    <radialGradient id="cabinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0" />
    </radialGradient>
    <pattern id="patch" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none" />
      <path d="M0 0H14M0 7H14M0 14H14M0 0V14M7 0V14M14 0V14" stroke="#2A3648" stroke-width="0.4" opacity="0.5" />
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#sky)" />

  <g opacity="0.5" fill="#0E1A2C">
    <path d="M0 90 Q 90 60 180 88 T 360 86 T 540 92 T 720 84 T 900 90 T 1080 86 T 1200 92 V0 H0 Z">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="
          M0 90 Q 90 60 180 88 T 360 86 T 540 92 T 720 84 T 900 90 T 1080 86 T 1200 92 V0 H0 Z;
          M0 96 Q 90 70 180 80 T 360 94 T 540 82 T 720 92 T 900 82 T 1080 94 T 1200 86 V0 H0 Z;
          M0 90 Q 90 60 180 88 T 360 86 T 540 92 T 720 84 T 900 90 T 1080 86 T 1200 92 V0 H0 Z" />
    </path>
  </g>

  <circle cx="1000" cy="70" r="90" fill="url(#moonGlow)" />
  <circle cx="1000" cy="70" r="34" fill="#EAF3FF" />
  <circle cx="1000" cy="70" r="34" fill="#0A1424" opacity="0.12" />
  <circle cx="988" cy="58" r="4" fill="#0A1424" opacity="0.12" />
  <circle cx="1012" cy="82" r="6" fill="#0A1424" opacity="0.1" />
  <rect x="0" y="150" width="1200" height="20" fill="url(#moonPath)" opacity="0.4" />

  <g fill="#EAF3FF" opacity="0.7">
    <circle cx="90" cy="35" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="220" cy="65" r="1" ><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.6s" repeatCount="indefinite" /></circle>
    <circle cx="360" cy="28" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s"   repeatCount="indefinite" /></circle>
    <circle cx="540" cy="50" r="1.1"><animate attributeName="opacity" values="1;0.2;1"   dur="3.6s" repeatCount="indefinite" /></circle>
    <circle cx="740" cy="24" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite" /></circle>
    <circle cx="1150" cy="40" r="1" ><animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.4s" repeatCount="indefinite" /></circle>
  </g>

  <rect y="170" width="1200" height="90" fill="url(#sea)" />

  <g id="ship" transform="translate(-420,0)">
    <animateTransform attributeName="transform" type="translate" from="-420 0" to="1500 0" dur="26s" repeatCount="indefinite" />
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 0 190;2.5 0 190;-2 0 190" dur="3.4s" repeatCount="indefinite" additive="sum" />

      <ellipse cx="0" cy="222" rx="150" ry="14" fill="#FFB347" opacity="0.06" />

      <!-- casco -->
      <path d="M -128 188 C -130 208 -108 224 -74 230 L 76 230 C 112 224 132 206 138 184
               L 112 190 L 82 193 L 34 196 L -34 196 L -82 193 L -112 190 Z"
            fill="#04070C" stroke="#2A3648" stroke-width="1.6" />
      <path d="M -120 192 L 118 192 L 112 202 L -112 202 Z" fill="#0B1626" stroke="#1479FF" stroke-width="0.5" opacity="0.5" />
      <path d="M -104 206 L 100 206 L 92 216 L -92 216 Z" fill="#04070C" opacity="0.9" />
      <g stroke="#1479FF" stroke-width="0.6" opacity="0.4">
        <line x1="-96" y1="196" x2="-96" y2="188" />
        <line x1="-64" y1="198" x2="-64" y2="188" />
        <line x1="-32" y1="199" x2="-32" y2="188" />
        <line x1="0" y1="200" x2="0" y2="188" />
        <line x1="32" y1="199" x2="32" y2="188" />
        <line x1="64" y1="198" x2="64" y2="188" />
        <line x1="96" y1="196" x2="96" y2="188" />
      </g>

      <!-- castelo de popa iluminado -->
      <path d="M 74 190 L 116 186 L 116 148 C 116 134 100 126 82 126 L 74 126 Z" fill="#0B1626" stroke="#2A3648" stroke-width="1.4" />
      <g>
        <rect x="84" y="140" width="10" height="14" rx="1.5" fill="#FFB347" opacity="0.85" />
        <rect x="98" y="140" width="10" height="14" rx="1.5" fill="#FFB347" opacity="0.7" />
        <circle cx="95" cy="148" r="22" fill="url(#cabinGlow)" />
      </g>
      <path d="M -74 188 L -118 184 L -118 164 C -118 156 -108 150 -96 150 L -74 150 Z" fill="#0B1626" stroke="#2A3648" stroke-width="1.4" />

      <!-- gurupé -->
      <line x1="-118" y1="176" x2="-172" y2="168" stroke="#4A5568" stroke-width="3" />
      <line x1="-150" y1="172" x2="-146" y2="184" stroke="#4A5568" stroke-width="1.5" />

      <!-- mastro traseiro (mezena) -->
      <line x1="66" y1="190" x2="66" y2="46" stroke="#4A5568" stroke-width="3" />
      <line x1="42" y1="66" x2="92" y2="66" stroke="#4A5568" stroke-width="2" />
      <path d="M 66 68 Q 34 90 40 150 Q 54 138 66 144 Q 78 138 66 68 Z"
            fill="url(#sailShade)" stroke="#1479FF" stroke-width="0.7" opacity="0.96" />
      <rect x="34" y="68" width="64" height="84" fill="url(#patch)" opacity="0.5" />

      <!-- mastro principal (o mais alto) -->
      <line x1="0" y1="192" x2="0" y2="6" stroke="#4A5568" stroke-width="3.6" />
      <line x1="-58" y1="26" x2="58" y2="26" stroke="#4A5568" stroke-width="2.4" />
      <line x1="-50" y1="60" x2="50" y2="60" stroke="#4A5568" stroke-width="2.2" />
      <line x1="-40" y1="96" x2="40" y2="96" stroke="#4A5568" stroke-width="2" />
      <path d="M 0 28 Q -56 50 -50 118 Q -22 102 0 108 Q 22 102 50 118 Q 56 50 0 28 Z"
            fill="url(#sailShade)" stroke="#1479FF" stroke-width="0.8" opacity="0.97" />
      <rect x="-56" y="28" width="112" height="94" fill="url(#patch)" opacity="0.55" />
      <path d="M -6 10 L 6 10 L 0 -2 Z" fill="#04070C" stroke="#1479FF" stroke-width="0.5" />

      <g id="flagMain">
        <animateTransform attributeName="transform" type="rotate" values="-8 0 4;7 0 4;-8 0 4" dur="1.5s" repeatCount="indefinite" />
        <path d="M 0 4 Q 26 -4 34 6 Q 26 16 0 10 Z" fill="#04070C" stroke="#1479FF" stroke-width="0.6" />
        <g transform="translate(16,6) scale(0.5)" fill="#EAF3FF">
          <circle cx="0" cy="0" r="4.2" />
          <path d="M -6 6 L -2 3 L 0 6 L 2 3 L 6 6 L 3 1 L 6 -1 L 2 -1 L 3 -5 L 0 -2 L -3 -5 L -2 -1 L -6 -1 L -3 1 Z" opacity="0.9" />
        </g>
      </g>

      <!-- mastro de proa (traquete) -->
      <line x1="-88" y1="184" x2="-88" y2="70" stroke="#4A5568" stroke-width="2.6" />
      <line x1="-124" y1="92" x2="-56" y2="92" stroke="#4A5568" stroke-width="1.8" />
      <path d="M -88 94 Q -128 112 -120 158 Q -100 146 -88 150 Q -76 146 -60 158 Q -52 112 -88 94 Z"
            fill="url(#sailShade)" stroke="#1479FF" stroke-width="0.7" opacity="0.96" />
      <rect x="-124" y="94" width="72" height="64" fill="url(#patch)" opacity="0.5" />

      <g id="flagFore">
        <animateTransform attributeName="transform" type="rotate" values="6 -88 72;-8 -88 72;6 -88 72" dur="1.7s" repeatCount="indefinite" />
        <path d="M -88 72 Q -64 64 -56 74 Q -64 84 -88 78 Z" fill="#04070C" stroke="#1479FF" stroke-width="0.6" />
        <g transform="translate(-72,74) scale(0.42)" fill="#EAF3FF">
          <circle cx="0" cy="0" r="4.2" />
          <path d="M -6 6 L -2 3 L 0 6 L 2 3 L 6 6 L 3 1 L 6 -1 L 2 -1 L 3 -5 L 0 -2 L -3 -5 L -2 -1 L -6 -1 L -3 1 Z" opacity="0.9" />
        </g>
      </g>

      <!-- luzes de bordo -->
      <g fill="#FFB347" opacity="0.85">
        <circle cx="-104" cy="180" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" /></circle>
        <circle cx="106" cy="176" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite" /></circle>
      </g>
    </g>
  </g>

  <g fill="none" stroke="#1479FF" stroke-opacity="0.5" stroke-width="2.2">
    <path d="M -60 208 Q 50 190 160 208 T 380 208 T 600 208 T 820 208 T 1040 208 T 1260 208 T 1480 208">
      <animate attributeName="d" dur="3.4s" repeatCount="indefinite"
        values="
          M -60 208 Q 50 190 160 208 T 380 208 T 600 208 T 820 208 T 1040 208 T 1260 208 T 1480 208;
          M -60 208 Q 50 226 160 208 T 380 208 T 600 208 T 820 208 T 1040 208 T 1260 208 T 1480 208;
          M -60 208 Q 50 190 160 208 T 380 208 T 600 208 T 820 208 T 1040 208 T 1260 208 T 1480 208" />
    </path>
  </g>
  <g fill="none" stroke="#EAF3FF" stroke-opacity="0.28" stroke-width="1.6">
    <path d="M -60 224 Q 60 212 180 224 T 420 224 T 660 224 T 900 224 T 1140 224 T 1380 224">
      <animate attributeName="d" dur="2.6s" repeatCount="indefinite"
        values="
          M -60 224 Q 60 212 180 224 T 420 224 T 660 224 T 900 224 T 1140 224 T 1380 224;
          M -60 224 Q 60 236 180 224 T 420 224 T 660 224 T 900 224 T 1140 224 T 1380 224;
          M -60 224 Q 60 212 180 224 T 420 224 T 660 224 T 900 224 T 1140 224 T 1380 224" />
    </path>
  </g>
  <g fill="none" stroke="#19D3FF" stroke-opacity="0.3" stroke-width="2">
    <path d="M -60 244 Q 70 234 200 244 T 460 244 T 720 244 T 980 244 T 1240 244 T 1500 244">
      <animate attributeName="d" dur="4.2s" repeatCount="indefinite"
        values="
          M -60 244 Q 70 234 200 244 T 460 244 T 720 244 T 980 244 T 1240 244 T 1500 244;
          M -60 244 Q 70 254 200 244 T 460 244 T 720 244 T 980 244 T 1240 244 T 1500 244;
          M -60 244 Q 70 234 200 244 T 460 244 T 720 244 T 980 244 T 1240 244 T 1500 244" />
    </path>
  </g>
</svg>
