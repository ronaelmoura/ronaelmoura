<svg width="100%" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pérola Negra navegando pelo grafo de contribuições">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070D" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B111A" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4F7FB" />
      <stop offset="100%" stop-color="#19D3FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#sky)" />

  <circle cx="1080" cy="55" r="34" fill="url(#moon)" />
  <circle cx="1080" cy="55" r="20" fill="#F4F7FB" opacity="0.9" />

  <g fill="#19D3FF" opacity="0.6">
    <circle cx="120" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="260" cy="60" r="1.1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.6s" repeatCount="indefinite" /></circle>
    <circle cx="420" cy="25" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="640" cy="45" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite" /></circle>
    <circle cx="820" cy="20" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite" /></circle>
    <circle cx="960" cy="70" r="1.1"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.4s" repeatCount="indefinite" /></circle>
  </g>

  <rect y="150" width="1200" height="70" fill="url(#sea)" />

  <g id="ship" transform="translate(-320,0)">
    <animateTransform attributeName="transform" type="translate" from="-320 0" to="1400 0" dur="22s" repeatCount="indefinite" />
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-1.5 0 150;1.5 0 150;-1.5 0 150" dur="4s" repeatCount="indefinite" additive="sum" />

      <!-- casco -->
      <path d="M -110 148 C -110 168 -90 182 -60 186 L 60 186 C 92 182 112 166 118 146
               L 96 150 L 70 152 L 30 154 L -30 154 L -70 152 L -96 150 Z"
            fill="#05070D" stroke="#1479FF" stroke-width="1.6" />
      <path d="M -100 150 L 100 150 L 96 158 L -96 158 Z" fill="#0B111A" stroke="#19D3FF" stroke-width="0.6" opacity="0.7" />
      <!-- amuradas / castelo de popa -->
      <path d="M 60 148 L 96 146 L 96 122 C 96 112 84 106 70 106 L 60 106 Z" fill="#0B111A" stroke="#1479FF" stroke-width="1.2" />
      <path d="M -60 148 L -96 146 L -96 132 C -96 126 -88 122 -78 122 L -60 122 Z" fill="#0B111A" stroke="#1479FF" stroke-width="1.2" />
      <!-- gurupés (bowsprit) -->
      <line x1="-96" y1="140" x2="-140" y2="134" stroke="#8891A3" stroke-width="2.5" />

      <!-- mastro traseiro (mezena) -->
      <line x1="52" y1="150" x2="52" y2="42" stroke="#6B7686" stroke-width="2.5" />
      <line x1="34" y1="60" x2="70" y2="60" stroke="#6B7686" stroke-width="1.8" />
      <path d="M 52 62 Q 30 78 34 118 Q 44 110 52 114 Z" fill="#05070D" stroke="#19D3FF" stroke-width="0.8" opacity="0.95" />

      <!-- mastro principal -->
      <line x1="0" y1="152" x2="0" y2="18" stroke="#6B7686" stroke-width="3" />
      <line x1="-42" y1="36" x2="42" y2="36" stroke="#6B7686" stroke-width="2" />
      <line x1="-34" y1="72" x2="34" y2="72" stroke="#6B7686" stroke-width="2" />
      <path d="M 0 38 Q -40 58 -36 108 Q -16 98 0 102 Z" fill="#0B111A" stroke="#19D3FF" stroke-width="0.9" opacity="0.95" />
      <path d="M 0 38 Q 40 58 36 108 Q 16 98 0 102 Z" fill="#05070D" stroke="#19D3FF" stroke-width="0.9" opacity="0.95" />
      <path d="M -8 22 L 8 22 L 0 12 Z" fill="#05070D" stroke="#19D3FF" stroke-width="0.6" />
      <g id="flag">
        <animateTransform attributeName="transform" type="rotate" values="-6 0 18;6 0 18;-6 0 18" dur="1.6s" repeatCount="indefinite" />
        <path d="M 0 18 Q 20 12 26 20 Q 20 28 0 24 Z" fill="#0B111A" stroke="#19D3FF" stroke-width="0.6" />
        <circle cx="14" cy="20" r="2" fill="#F4F7FB" opacity="0.85" />
      </g>

      <!-- mastro de proa (traquete) -->
      <line x1="-72" y1="146" x2="-72" y2="58" stroke="#6B7686" stroke-width="2.2" />
      <line x1="-96" y1="76" x2="-48" y2="76" stroke="#6B7686" stroke-width="1.6" />
      <path d="M -72 78 Q -100 94 -94 128 Q -80 120 -72 124 Z" fill="#0B111A" stroke="#19D3FF" stroke-width="0.8" opacity="0.9" />
      <path d="M -72 78 Q -48 94 -52 128 Q -64 120 -72 124 Z" fill="#05070D" stroke="#19D3FF" stroke-width="0.8" opacity="0.9" />

      <!-- luzes de bordo -->
      <g fill="#19D3FF" opacity="0.8">
        <circle cx="-90" cy="142" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" /></circle>
        <circle cx="88" cy="140" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite" /></circle>
      </g>
    </g>
  </g>

  <g fill="none" stroke="#1479FF" stroke-opacity="0.55" stroke-width="2">
    <path d="M -50 172 Q 50 160 150 172 T 350 172 T 550 172 T 750 172 T 950 172 T 1150 172 T 1350 172">
      <animate attributeName="d"
        values="
          M -50 172 Q 50 160 150 172 T 350 172 T 550 172 T 750 172 T 950 172 T 1150 172 T 1350 172;
          M -50 172 Q 50 184 150 172 T 350 172 T 550 172 T 750 172 T 950 172 T 1150 172 T 1350 172;
          M -50 172 Q 50 160 150 172 T 350 172 T 550 172 T 750 172 T 950 172 T 1150 172 T 1350 172"
        dur="4s" repeatCount="indefinite" />
    </path>
  </g>
  <g fill="none" stroke="#19D3FF" stroke-opacity="0.35" stroke-width="2">
    <path d="M -50 196 Q 50 186 150 196 T 350 196 T 550 196 T 750 196 T 950 196 T 1150 196 T 1350 196">
      <animate attributeName="d"
        values="
          M -50 196 Q 50 186 150 196 T 350 196 T 550 196 T 750 196 T 950 196 T 1150 196 T 1350 196;
          M -50 196 Q 50 206 150 196 T 350 196 T 550 196 T 750 196 T 950 196 T 1150 196 T 1350 196;
          M -50 196 Q 50 186 150 196 T 350 196 T 550 196 T 750 196 T 950 196 T 1150 196 T 1350 196"
        dur="5s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
